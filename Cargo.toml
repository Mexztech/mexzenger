[package]
name = "private-messenger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
arti-client = { version = "0.46.0", features = ["tokio", "native-tls", "onion-service-client", "onion-service-service"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13"
ksi-double-ratchet = "0.1.3"
rand = "0.10.2"
rand_core_04 = { package = "rand_core", version = "0.4.2" }
rpassword = "7.5.4"
safelog = "0.9.1"
sha2 = "0.11.0"
snow = "0.10.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "io-util", "macros", "time", "net"] }
tor-hsrproxy = "0.46.0"
tor-hsservice = "0.46.0"
tor-rtcompat = { version = "0.46.0", features = ["tokio", "native-tls"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
yosemite = "0.7.0"
zeroize = { version = "1.9.0", features = ["derive"] }
cpal = "0.15"
audiopus = "0.2"
